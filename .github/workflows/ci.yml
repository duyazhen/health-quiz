name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: health_quiz_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @health-quiz/web exec prisma generate
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/health_quiz_test
      - run: pnpm exec prisma migrate deploy
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/health_quiz_test
      - run: pnpm test
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/health_quiz_test
